<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
  </head>
  <body>
    <header>
      <table border="1" align="center" cellpadding="5">
        <tr>
          <td>
            <img
              src="./assets/fonts/logo.png"
              alt="Saylani Logo"
              height="30"
            />
          </td>
          <td><a href="index.html">Home</a></td>
          <td><a href="about.html">About</a></td>
          <td><a href="gallery.html">Gallery</a></td>
          <td><a href="media.html">Media</a></td>
          <td><a href="contact.html">Contact</a></td>
          <td><a href="login.html">Login</a></td>
          <td><a href="register.html">Register</a></td>
        </tr>
      </table>
    </header>
    <hr />
    <main>
      <h1 align="center">Login page</h1>
      <hr />
      <h3 align="center">Please login to continue</h3>
      <hr />
      <div align="center">
        <form action="#" method="post">
          <fieldset style="width: 220px; text-align: left">
            <legend>Login</legend>
            <p>
              <label for="email">Email:</label><br />
              <input type="email" id="email" name="email" placeholder="Email" />
            </p>
            <p>
              <label for="password">Password:</label><br />
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
              />
            </p>
            <p>
              <input type="submit" value="Login" />
            </p>
            <p>
              <a href="register.html">Not a user?</a>
            </p>
          </fieldset>
        </form>
      </div>
    </main>
    <hr />
    <footer>
      <p align="center">Copyright &copy; 2026. All rights reserved.</p>
    </footer>
  </body>
</html>
