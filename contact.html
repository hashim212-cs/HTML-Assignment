    </header>
    <hr />
    <center>
      <main>
        <h1>Contact page</h1>
        <hr />
        <h2>How Can We Help?</h2>
        <p>
          We will be happy to help you. Fill out the form and we will get back
          to you shortly.
        </p>
        <hr />
        <form action="#" method="post">
          <p>
            <label for="name">Name *: </label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Full Name *"
              required
            />
          </p>
          <p>
            <label for="email">Email: </label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              required
            />
          </p>
          <p>
            <label for="subject">Subject * : </label>
            <input
              type="text"
              id="subject"
              name="subject"
              placeholder="Subject *"
              required
            />
          </p>
          <p>
            <textarea
              id="message"
              name="message"
              rows="6"
              cols="45"
              placeholder="Your Question / Query / Message *"
              required
            ></textarea>
          </p>
          <p>
            <input type="submit" value="Send Message" />
          </p>
        </form>
      </main>
      <hr />
      <footer>
        <p>Copyright &copy; 2026. All rights reserved.</p>
      </footer>
    </center>
